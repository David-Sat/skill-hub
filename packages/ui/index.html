<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>(ノ^_^)ノ┻━┻ SkillDesk - Unified Skill & MCP Manager</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23161b22'/><text x='50%25' y='55%25' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-size='11' font-weight='bold' fill='%2338bdf8'>┻━┻</text></svg>" />
    <style>
      :root {
        --bg-main: #0b0f17;
        --bg-panel: #111827;
        --bg-card: #161f30;
        --bg-card-hover: #1e293b;
        --border: #243045;
        --border-active: #38bdf8;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.15);
        --green: #10b981;
        --green-bg: rgba(16, 185, 129, 0.12);
        --amber: #f59e0b;
        --amber-bg: rgba(245, 158, 11, 0.12);
        --rose: #f43f5e;
        --rose-bg: rgba(244, 63, 94, 0.12);
        --purple: #8b5cf6;
        --purple-bg: rgba(139, 92, 246, 0.12);
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: var(--font-sans);
        line-height: 1.5;
        overflow-x: hidden;
      }
      code, pre {
        font-family: var(--font-mono);
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-main);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
